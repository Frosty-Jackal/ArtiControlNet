<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlNet Canny 生成器</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app" class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8 text-indigo-700">ControlNet Canny 控制面板</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-lg shadow-md space-y-4">
                <h2 class="text-xl font-semibold border-b pb-2">配置参数</h2>

                <div>
                    <label class="block text-sm font-medium text-gray-700">上传原始图片</label>
                    <input type="file" @change="handleFileUpload" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"/>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">提示词 (Prompt)</label>
                    <textarea v-model="form.prompt" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2 text-sm"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">步数 (Steps)</label>
                        <input type="number" v-model="form.ddim_steps" class="mt-1 block w-full border rounded p-1 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">引导 (Scale)</label>
                        <input type="number" step="0.5" v-model="form.scale" class="mt-1 block w-full border rounded p-1 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Canny 阈值 (低: {{form.low_threshold}} 高: {{form.high_threshold}})</label>
                    <div class="flex space-x-2">
                        <input type="range" min="1" max="255" v-model="form.low_threshold" class="w-full">
                        <input type="range" min="1" max="255" v-model="form.high_threshold" class="w-full">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">控制强度: {{form.strength}}</label>
                    <input type="range" min="0" max="2" step="0.1" v-model="form.strength" class="w-full">
                </div>

                <button @click="generate" :disabled="loading" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 disabled:bg-gray-400 transition">
                    {{ loading ? '生成中...' : '开始生成' }}
                </button>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-lg shadow-md min-h-[400px]">
                    <h2 class="text-xl font-semibold border-b pb-2 mb-4">生成结果</h2>

                    <div v-if="!results.length && !loading" class="flex items-center justify-center h-64 text-gray-400">
                        上传图片并点击“开始生成”查看结果
                    </div>

                    <div v-if="loading" class="flex flex-col items-center justify-center h-64">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
                        <p class="mt-4 text-gray-500">正在处理，请稍候（取决于 GPU 性能）...</p>
                    </div>

                    <div v-if="results.length" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div v-for="(img, index) in results" :key="index" class="border rounded overflow-hidden">
                            <p class="text-xs bg-gray-100 p-1 text-center font-mono">{{ index === 0 ? 'Canny Edge' : 'Generated Image ' + index }}</p>
                            <img :src="img" class="w-full h-auto">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const loading = ref(false);
                const selectedFile = ref(null);
                const results = ref([]);

                const form = ref({
                    prompt: "a beautiful landscape, oil painting",
                    a_prompt: "best quality, extremely detailed",
                    n_prompt: "lowres, bad anatomy, worst quality, low quality",
                    num_samples: 1,
                    image_resolution: 512,
                    ddim_steps: 20,
                    scale: 9.0,
                    seed: -1,
                    low_threshold: 100,
                    high_threshold: 200,
                    strength: 1.0,
                    guess_mode: false
                });

                const handleFileUpload = (event) => {
                    selectedFile.value = event.target.files[0];
                };

                const generate = async () => {
                    if (!selectedFile.value) {
                        alert("请先选择一张图片！");
                        return;
                    }

                    loading.value = true;
                    results.value = [];

                    const formData = new FormData();
                    formData.append('image', selectedFile.value);

                    // 将所有表单参数加入 FormData
                    Object.keys(form.value).forEach(key => {
                        formData.append(key, form.value[key]);
                    });

                    try {
                        // 注意：这里需要根据你后端的实际 IP 修改地址
                        const response = await axios.post('http://localhost:8000/api/controlnet/generate_canny', formData);

                        // 假设后端返回的是 base64 列表： { "results": ["data:image/png;base64,..."] }
                        if (response.data.status === "success") {
                            results.value = response.data.images;
                        }
                    } catch (error) {
                        console.error("生成失败:", error);
                        alert("生成失败，请检查后端服务是否启动。");
                    } finally {
                        loading.value = false;
                    }
                };

                return { form, handleFileUpload, generate, loading, results };
            }
        }).mount('#app');
    </script>
</body>
</html>
